<!doctype html>
<html lang="en">
  <head>
    <!-- Must run before application bundles so this runs before jqWidgets document keydown handlers -->
    <script>
      (function () {
        function modalOverlayForActiveElement() {
          var active = document.activeElement;
          var list = document.querySelectorAll(".modal-overlay");
          if (!list.length) return null;
          if (active && active.closest) {
            var inside = active.closest(".modal-overlay");
            if (inside) return inside;
          }
          return list[list.length - 1];
        }
        document.addEventListener(
          "keydown",
          function (event) {
            var key = event.key;
            if (
              key !== "ArrowLeft" &&
              key !== "ArrowRight" &&
              key !== "ArrowUp" &&
              key !== "ArrowDown"
            ) {
              return;
            }
            var overlay = modalOverlayForActiveElement();
            if (!overlay) return;
            var actions = overlay.querySelector(".modal-actions");
            if (!actions) return;
            var buttons = actions.querySelectorAll("button");
            if (buttons.length < 2) return;

            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) {
              event.stopImmediatePropagation();
            }

            var nodes = Array.prototype.slice.call(buttons);
            /* Match on-screen order (flex row-reverse / justify-end breaks DOM vs visual) */
            nodes.sort(function (a, b) {
              return (
                a.getBoundingClientRect().left - b.getBoundingClientRect().left
              );
            });
            var active = document.activeElement;
            var idx = active ? nodes.indexOf(active) : -1;
            if (idx < 0 && active && active.closest) {
              var btn = active.closest("button");
              if (btn) idx = nodes.indexOf(btn);
            }
            if (idx < 0) {
              nodes[0].focus();
              return;
            }
            var next =
              key === "ArrowRight" || key === "ArrowDown"
                ? (idx + 1) % nodes.length
                : (idx - 1 + nodes.length) % nodes.length;
            nodes[next].focus();
          },
          true,
        );
      })();
    </script>
    <script>
      (function () {
        var base = document.querySelector("base");
        var baseHref = (base && base.getAttribute("href")) || "/";
        var configUrl =
          baseHref.replace(/\/?$/, "/") + "assets/config.client.json";
        fetch(configUrl)
          .then(function (r) {
            return r.json();
          })
          .then(function (config) {
            window.appConfig = config;
          })
          .catch(function () {});
      })();
    </script>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Add Roboto font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Roboto", sans-serif;
      }
    </style>
    <!-- Add Material Icons font -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <!-- JQWidgets styles are included via angular.json styles (local: src/app/JQWidgets/jqwidgets/styles/) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="mat-typography">
    <app-root></app-root>
    <script>
      (function setJqxCredits() {
        var jqx =
          (window.$ || window.jQuery) && (window.$ || window.jQuery).jqx;
        var credits = window.jqxCredits;
        if (jqx && credits !== undefined) {
          jqx.credits = credits;
        } else {
          setTimeout(setJqxCredits, 10);
        }
      })();
    </script>
  </body>
</html>
